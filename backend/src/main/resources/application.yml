spring:
  application:
    name: vestige-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:vestige_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VestigeHikariPool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET:}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  supabase:
    url: ${SUPABASE_URL:https://qiylcwurlhyhzhachoyb.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    jwks-url: ${SUPABASE_JWKS_URL:https://qiylcwurlhyhzhachoyb.supabase.co/auth/v1/.well-known/jwks.json}
    storage:
      vendor-docs-bucket: vendor-verification-documents
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_placeholder}

logging:
  level:
    root: INFO
    com.vestige: DEBUG
    org.hibernate.SQL: INFO
