server:
  port: ${PORT:8088}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:vestige_dev_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

logging:
  level:
    root: INFO
    com.vestige: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    secret: ${JWT_SECRET:vestige-local-development-secret-change-before-deployment}
